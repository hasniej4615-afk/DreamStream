# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC -XX:MaxMetaspaceSize=768m -XX:+ParallelRefProcEnabled -Dfile.encoding=UTF-8
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# Kotlin daemon JVM settings
kotlin.daemon.jvm.options=-Xmx1536m -XX:+UseG1GC -XX:MaxMetaspaceSize=512m

# Worker count capped to 4 (prevent 100% CPU lockup and memory thrashing on 8-thread CPU)
org.gradle.workers.max=4
org.gradle.parallel=true

# Disable VFS watching on Windows to prevent file locking hangs
org.gradle.vfs.watch=false

# Disable configuration cache to prevent KSP/Hilt serialization deadlocks in Gradle 9.4
org.gradle.configuration-cache=false

# Kotlin code style for this project:
kotlin.code.style=official
android.disallowKotlinSourceSets=false

# Enable build caching
org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
